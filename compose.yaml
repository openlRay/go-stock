services:
  go-stock:
    image: go-stock:local
    build:
      context: .
      dockerfile: Dockerfile
      args:
        NODE_IMAGE: "${NODE_IMAGE:-docker.m.daocloud.io/library/node:22-bookworm-slim}"
        GO_IMAGE: "${GO_IMAGE:-docker.m.daocloud.io/library/golang:1.26-bookworm}"
        GOPROXY: "${GOPROXY:-https://goproxy.cn}"
        GOSUMDB: "${GOSUMDB:-sum.golang.org}"
        RUNTIME_IMAGE: "${RUNTIME_IMAGE:-docker.m.daocloud.io/library/debian:bookworm-slim}"
        DEBIAN_MIRROR: "${DEBIAN_MIRROR:-https://mirrors.aliyun.com}"
    restart: unless-stopped
    init: true
    environment:
      TZ: Asia/Shanghai
      GO_STOCK_WEB_ADDR: 0.0.0.0:18888
    # 默认绑定 0.0.0.0，便于 NAS / 局域网用 IP:端口访问。
    # Web 版无登录，勿直接暴露公网；仅本机访问时可设 GO_STOCK_WEB_HOST=127.0.0.1
    ports:
      - "${GO_STOCK_WEB_HOST:-0.0.0.0}:${GO_STOCK_WEB_PORT:-18888}:18888"
    volumes:
      - go-stock-data:/app/data
      - go-stock-skills:/app/skills
      - go-stock-logs:/app/logs
      - go-stock-memory:/app/memory
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "--show-error", "http://127.0.0.1:18888/api/health"]
      interval: 30s
      timeout: 5s
      start_period: 30s
      retries: 3
    stop_grace_period: 20s

volumes:
  go-stock-data:
    name: go-stock-data
  go-stock-skills:
    name: go-stock-skills
  go-stock-logs:
    name: go-stock-logs
  go-stock-memory:
    name: go-stock-memory
