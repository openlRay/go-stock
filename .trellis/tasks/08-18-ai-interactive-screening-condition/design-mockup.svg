    <rect x="318" y="225" width="942" height="112" rx="7" fill="#fff" stroke="#d9dde4" stroke-width="1.5"/>
    <rect x="338" y="241" width="86" height="27" rx="13" fill="#edf7f1"/>
    <text x="381" y="260" text-anchor="middle" font-size="14" font-weight="650" fill="#168553">当前条件</text>
    <text x="340" y="294" class="body">20日总涨幅大于20%，当天换手率大于5%，收盘在均价线上方，</text>
    <text x="340" y="322" class="body">市值；不要ST股及不要退市股；不要科创板和创业板</text>

    <rect x="318" y="357" width="942" height="449" rx="12" fill="#f2faf6" stroke="#79caa3" stroke-width="1.5"/>
    <circle cx="352" cy="392" r="17" fill="#18a058"/>
    <path d="M347 392h10M352 387v10" stroke="#fff" stroke-width="2.3" stroke-linecap="round"/>
    <text x="380" y="400" font-size="22" font-weight="700" fill="#176b47">AI 选股助手</text>
    <text x="380" y="427" class="small">AI 建议独立预览，应用前不会修改当前条件</text>

    <text x="342" y="468" class="small" font-weight="650">对话模型</text>
    <rect x="430" y="444" width="250" height="40" rx="6" fill="#fff" stroke="#cfd8d3"/>
    <text x="448" y="470" class="small" fill="#30343a">默认模型</text>
    <path d="M653 460l6 7 6-7" fill="none" stroke="#7a8480" stroke-width="1.7"/>

    <text x="342" y="516" class="small" font-weight="650">告诉 AI 你想怎么选</text>
    <rect x="342" y="530" width="690" height="63" rx="7" fill="#fff" stroke="#bfcac4"/>
    <text x="360" y="557" class="small" fill="#31363b">在当前条件基础上，增加量比大于1.2，</text>
    <text x="360" y="580" class="small" fill="#31363b">并整理成更清晰的条件</text>
    <rect x="1048" y="530" width="182" height="63" rx="7" fill="#18a058"/>
    <text x="1139" y="570" text-anchor="middle" class="button" fill="#fff">生成建议</text>

    <g>
      <rect x="342" y="608" width="128" height="31" rx="15" fill="#fff" stroke="#bfd8cb"/>
      <text x="406" y="629" text-anchor="middle" class="tiny" fill="#4a6457">稳健低估值</text>
      <rect x="480" y="608" width="142" height="31" rx="15" fill="#fff" stroke="#bfd8cb"/>
      <text x="551" y="629" text-anchor="middle" class="tiny" fill="#4a6457">短线放量突破</text>
      <rect x="632" y="608" width="156" height="31" rx="15" fill="#fff" stroke="#bfd8cb"/>
      <text x="710" y="629" text-anchor="middle" class="tiny" fill="#4a6457">排除高风险板块</text>
    </g>

    <rect x="342" y="654" width="888" height="129" rx="9" fill="#fff" stroke="#c9d8d0"/>
    <text x="362" y="682" font-size="17" font-weight="700" fill="#29312d">AI 建议稿</text>
    <rect x="458" y="663" width="66" height="25" rx="12" fill="#fff7e8"/>
    <text x="491" y="681" text-anchor="middle" class="tiny" fill="#ad6800">未应用</text>
    <text x="362" y="714" class="small" fill="#303a35">沪深A股；近20日总涨幅大于20%；当日换手率大于5%；量比大于1.2；</text>
    <text x="362" y="739" class="small" fill="#303a35">收盘价在均价线上方；排除ST股、退市股、科创板和创业板。</text>
    <text x="362" y="766" class="tiny" fill="#648071">已补充量比条件，并统一整理排除项</text>
    <text x="761" y="766" class="tiny" fill="#b26a00">⚠ 请在执行选股后核对实际识别条件</text>

    <rect x="750" y="796" width="126" height="0" fill="none"/>





















































































































    <rect x="724" y="792" width="115" height="38" rx="6" fill="#fff" stroke="#d6dbe0"/>
    <text x="781" y="817" text-anchor="middle" class="small" fill="#606870">放弃建议</text>
    <rect x="851" y="792" width="125" height="38" rx="6" fill="#fff" stroke="#18a058"/>
    <text x="913" y="817" text-anchor="middle" class="small" fill="#168553">继续调整</text>
    <rect x="988" y="792" width="210" height="38" rx="6" fill="#18a058"/>
    <text x="1093" y="817" text-anchor="middle" class="small" font-weight="650" fill="#fff">应用到选股条件</text>

    <text x="166" y="874" class="label">策略描述</text>
    <rect x="318" y="844" width="942" height="74" rx="7" fill="#fff" stroke="#d9dde4" stroke-width="1.5"/>
    <text x="340" y="887" class="body" fill="#b8bec5">可选，对策略的简要说明</text>

    <line x1="110" y1="950" x2="1330" y2="950" stroke="#eef0f2"/>
    <rect x="1015" y="967" width="105" height="45" rx="6" fill="#fff" stroke="#d8dce2"/>
    <text x="1067" y="997" text-anchor="middle" class="button" fill="#454b52">取消</text>
    <rect x="1138" y="967" width="122" height="45" rx="6" fill="#18a058"/>
    <text x="1199" y="997" text-anchor="middle" class="button" fill="#fff">保存</text>
