<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="1060" viewBox="0 0 1440 1060">
  <defs>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="160%">
      <feDropShadow dx="0" dy="18" stdDeviation="24" flood-color="#0f172a" flood-opacity="0.24"/>
    </filter>
    <style>
      .ui { font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Microsoft YaHei", sans-serif; }
      .title { font-size: 30px; font-weight: 700; fill: #20242a; }
      .label { font-size: 21px; font-weight: 600; fill: #292d33; }
      .body { font-size: 19px; fill: #30343a; }
      .small { font-size: 16px; fill: #68727d; }
      .tiny { font-size: 14px; fill: #79838e; }
      .button { font-size: 17px; font-weight: 650; }
    </style>
  </defs>

  <rect width="1440" height="1060" fill="#0b0d0f"/>
  <rect x="38" y="32" width="1364" height="996" rx="34" fill="#f5f7f9"/>
  <g class="ui" opacity="0.58">
    <text x="66" y="92" font-size="22" fill="#1464b5">卧龙电驱</text>
    <text x="360" y="92" font-size="22" fill="#b62c45">37.87</text>
    <text x="645" y="92" font-size="22" fill="#b62c45">7.40</text>
    <text x="930" y="92" font-size="22" fill="#1464b5">591.57亿</text>
    <text x="1220" y="92" font-size="22" fill="#1464b5">上交所主板</text>
    <line x1="38" y1="120" x2="1402" y2="120" stroke="#cbd1d7"/>
    <text x="66" y="172" font-size="22" fill="#1464b5">方正科技</text>
    <text x="66" y="252" font-size="22" fill="#1464b5">超颖电子</text>
    <text x="66" y="332" font-size="22" fill="#1464b5">天通股份</text>
    <text x="66" y="412" font-size="22" fill="#1464b5">洁美科技</text>
    <text x="66" y="492" font-size="22" fill="#1464b5">中粮糖业</text>
    <text x="66" y="572" font-size="22" fill="#1464b5">旭光电子</text>
    <text x="66" y="652" font-size="22" fill="#1464b5">中鼎股份</text>
    <text x="66" y="732" font-size="22" fill="#1464b5">嘉德科技</text>
    <g stroke="#d9dee3">
      <line x1="38" y1="200" x2="1402" y2="200"/><line x1="38" y1="280" x2="1402" y2="280"/>
      <line x1="38" y1="360" x2="1402" y2="360"/><line x1="38" y1="440" x2="1402" y2="440"/>
      <line x1="38" y1="520" x2="1402" y2="520"/><line x1="38" y1="600" x2="1402" y2="600"/>
      <line x1="38" y1="680" x2="1402" y2="680"/><line x1="38" y1="760" x2="1402" y2="760"/>
    </g>
  </g>
  <rect x="38" y="32" width="1364" height="996" rx="34" fill="#1b2025" opacity="0.42"/>

  <g class="ui" filter="url(#shadow)">
    <rect x="110" y="38" width="1220" height="984" rx="14" fill="#ffffff"/>

    <circle cx="164" cy="91" r="25" fill="#18a058"/>
    <text x="164" y="101" text-anchor="middle" font-size="31" font-weight="700" fill="#fff">i</text>
    <text x="204" y="101" class="title">编辑策略</text>
    <text x="1278" y="104" font-size="42" font-weight="300" fill="#62676d">×</text>
    <line x1="110" y1="134" x2="1330" y2="134" stroke="#eef0f2"/>

    <text x="166" y="186" class="label">策略名称</text>
    <rect x="318" y="151" width="942" height="58" rx="7" fill="#fff" stroke="#18a058" stroke-width="2"/>
